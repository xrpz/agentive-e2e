# agentive-unit: rl.ci.agentive-lint
# design: spec.repo_checks.agentive_lint, spec.repo_layer.files[f-ci], spec.repo_layer.files[f-lint]
# One job for every agentive repo check (size, provenance, check-tags, persist, skills, lock, rules, links when enabled);
# `rules` fails when AGENTS.md#path-rules or a .claude/rules copy drifts from .agents/rules (RULESNEUTRAL).
name: agentive-lint
"on":
  pull_request:
  merge_group:
permissions:
  contents: read
jobs:
  agentive-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .agents/bin/agentive-lint ci
