[project]
name = "shop"
version = "0.1.0"
description = "agentive e2e test app: a tiny shop library"
requires-python = ">=3.10"
dependencies = [
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
